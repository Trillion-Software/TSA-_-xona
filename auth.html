<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xona TSA — Authentification</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div style="width:56px;height:56px;border-radius:14px;background:var(--black);display:flex;align-items:center;justify-content:center;margin-bottom:28px;">
      <span style="color:#fff;font-size:28px;font-weight:800;">X</span>
    </div>

    <h1 id="mode-title">Créer un compte</h1>
    <p class="subtitle">Xona TSA — billetterie numérique pour vos événements.</p>

    <form id="auth-form">
      <label class="field-label">Adresse e-mail</label>
      <input type="email" id="email" placeholder="nom@exemple.com" required>

      <label class="field-label">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" minlength="6" required>

      <button type="submit" class="btn btn-primary" id="submit-btn">Créer mon compte</button>
    </form>

    <div style="text-align:center;margin-top:16px;">
      <button class="btn-link" id="toggle-mode">Déjà un compte ? Se connecter</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let mode = 'signup'; // ou 'login'
    const title = document.getElementById('mode-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-mode');

    toggle.addEventListener('click', () => {
      mode = mode === 'signup' ? 'login' : 'signup';
      const isSignUp = mode === 'signup';
      title.textContent = isSignUp ? 'Créer un compte' : 'Connexion';
      submitBtn.textContent = isSignUp ? 'Créer mon compte' : 'Se connecter';
      toggle.textContent = isSignUp ? 'Déjà un compte ? Se connecter' : "Pas encore de compte ? En créer un";
    });

    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      // TODO: brancher Firebase Authentication (e-mail/mot de passe) ici.
      Session.user = { id: 'demo_user', email, role: null, country: null };
      if (mode === 'signup') {
        Session.legalAccepted = false; // acceptation obligatoire à refaire pour un nouveau compte
      }
      window.location.href = 'profile-choice.html';
    });
  </script>
</body>
</html>
