<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xona TSA</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .splash { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .splash img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .loader {
    position: absolute; bottom: 48px; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.4px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="splash">
    <img src="splash-banner.png" alt="Xona TSA — by Trillion Software">
    <div class="loader"><div class="spinner"></div></div>
  </div>
  <script>
    setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
  </script>
</body>
</html>
